<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Island Markets</title>
<meta name="description" content="A six-player classroom game on general equilibrium under uncertainty: Arrow–Debreu securities, market completeness and Radner economies." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f1f3f1; --card: #ffffff; --soft: #f6f7f5; --ink: #1a201e; --ink-2: #3b433f; --muted: #5f6865;
  --line: #dfe4e1; --line-2: #c9d0cc;
  --accent: #1f4741; --accent-2: #416b64; --accent-wash: #e3ecea;
  --mark: #7a3b42; --mark-wash: #f5e9ea;
  --good: #1b7a4b; --good-wash: #e3f3ea; --bad: #b3261e; --bad-wash: #fbe9e7; --warn: #8a5a00; --warn-wash: #fdf2d8;
  --display: "Newsreader", Georgia, serif; --body: "Source Sans 3", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px; --shadow: 0 1px 2px rgba(26,32,30,.06), 0 4px 14px rgba(26,32,30,.05);
}
*, *::before, *::after { box-sizing: border-box; } * { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); font-weight: 500; line-height: 1.2; color: var(--ink); }
h1 { font-size: clamp(2rem, 5vw, 3rem); } h2 { font-size: 1.55rem; } h3 { font-size: 1.2rem; }
p + p { margin-top: .55rem; }
b, strong { font-weight: 600; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); } .small { font-size: .9rem; } .tiny { font-size: .8rem; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.katex { font-size: 1.04em; }
.katex-display { overflow-x: auto; overflow-y: hidden; }

/* top bar */
.top { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top .wrap { display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap; padding-top: .6rem; padding-bottom: .6rem; }
.brand { font-family: var(--display); font-size: 1.25rem; font-weight: 600; color: var(--accent); }
.spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .65rem; border-radius: 999px; font-size: .85rem; background: var(--soft); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.me { background: var(--accent-wash); border-color: transparent; color: var(--accent); font-weight: 600; }
.chip.ok { background: var(--good-wash); border-color: transparent; color: var(--good); }
.chip.bad { background: var(--bad-wash); border-color: transparent; color: var(--bad); }
.chip.warn { background: var(--warn-wash); border-color: transparent; color: var(--warn); }
.chip.code { font-family: var(--mono); font-size: 1rem; letter-spacing: .15em; background: var(--accent); color: #fff; border: 0; }
.steps { display: flex; gap: .25rem; flex-wrap: wrap; }
.steps span { font-size: .8rem; padding: .18rem .6rem; border-radius: 999px; color: var(--muted); }
.steps span.on { background: var(--accent); color: #fff; font-weight: 600; }
.steps span.done { color: var(--accent-2); }
.steps span.done::before { content: '✓ '; }

main { padding: 1.2rem 0 5rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem 1.25rem; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 1rem; }
.grid2 { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); align-items: start; }

/* "what to do now" banner */
.now { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--accent); color: #fff; border-radius: var(--r); padding: 1rem 1.25rem; }
.now .step { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; opacity: .8; font-weight: 600; }
.now h2 { color: #fff; font-size: 1.6rem; margin: .1rem 0 .2rem; }
.now p { color: rgba(255,255,255,.9); max-width: 62ch; }
.now .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.now button.primary { background: #fff; color: var(--accent); border-color: #fff; }
.now button.ghost { color: #fff; border-color: rgba(255,255,255,.5); }
.now.wait { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.now.wait h2 { color: var(--ink); } .now.wait p { color: var(--ink-2); }

/* story */
.story .tag { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-2); font-weight: 600; }
.story h2 { margin: .15rem 0 .5rem; }
.story p { color: var(--ink-2); }
.story .goal { background: var(--accent-wash); border-radius: 10px; padding: .55rem .8rem; margin-top: .7rem; color: var(--ink); }
.sec { margin: 1.4rem 0 .6rem; }

/* weather tiles */
.tiles { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.tile { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.tile-h { background: var(--w); padding: .55rem .9rem; display: flex; align-items: baseline; gap: .45rem; }
.tile-h .ic { font-size: 1.3rem; } .tile-h b { font-family: var(--display); font-size: 1.25rem; font-weight: 600; color: var(--c); }
.tile-h .pr { margin-left: auto; font-size: .85rem; color: var(--muted); }
.tile-b { padding: .6rem .9rem .8rem; display: grid; gap: .35rem; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; color: var(--ink-2); font-size: .95rem; }
.kv b { font-family: var(--mono); font-weight: 500; color: var(--ink); white-space: nowrap; }
.kv.big b { font-size: 1.35rem; }
.kv.me { color: var(--ink); font-weight: 600; }
.kv.hl { background: var(--soft); margin: 0 -.5rem; padding: .25rem .5rem; border-radius: 8px; }
.up { color: var(--good); } .down { color: var(--bad); }
.plan { border-top: 1px dashed var(--line-2); margin-top: .3rem; padding-top: .55rem; }
.plan label { font-weight: 600; font-size: .95rem; display: block; margin-bottom: .3rem; }

/* inputs */
button { font: inherit; font-weight: 600; font-size: .95rem; border-radius: 10px; padding: .55rem 1.05rem; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { background: var(--accent-2); }
button.big { font-size: 1.05rem; padding: .7rem 1.3rem; }
button.ghost { background: transparent; }
button.sm { padding: .3rem .65rem; font-size: .85rem; }
button:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line-2); border-radius: 10px; padding: .45rem .65rem; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
input.num { width: 100%; text-align: right; font-size: 1.1rem; }
.stepper { display: grid; grid-template-columns: 2.6rem 1fr 2.6rem; gap: .35rem; }
.stepper button { justify-content: center; padding: .4rem 0; font-size: 1.2rem; line-height: 1; }
input.code { font-family: var(--mono); text-transform: uppercase; letter-spacing: .3em; font-size: 1.4rem; text-align: center; width: 100%; }
textarea { width: 100%; min-height: 300px; font-family: var(--mono); font-size: .8rem; }
.fld { display: grid; gap: .3rem; font-size: .92rem; color: var(--ink-2); }

/* budget + advice */
.budget .bar { height: 12px; background: var(--soft); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: .5rem 0; }
.budget .bar i { display: block; height: 100%; border-radius: 999px; background: var(--good); transition: width .2s; }
.budget .bar i.over { background: var(--bad); } .budget .bar i.under { background: #d99400; }
.msg { border-radius: 10px; padding: .6rem .8rem; font-size: .95rem; }
.msg.ok { background: var(--good-wash); color: #13573a; } .msg.bad { background: var(--bad-wash); color: #8c1d16; } .msg.warn { background: var(--warn-wash); color: #6b4600; } .msg.info { background: var(--accent-wash); color: var(--accent); }
.msg + .msg { margin-top: .5rem; }
.worth { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: .3rem 0 .6rem; }
.worth div { display: grid; } .worth b { font-family: var(--mono); font-size: 1.6rem; font-weight: 500; } .worth span { font-size: .82rem; color: var(--muted); }
.news { background: var(--warn-wash); border-radius: 10px; padding: .6rem .85rem; color: #5c3d00; }
.news.ok { background: var(--good-wash); color: #13573a; }

/* assets */
.assets { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.asset { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: .8rem .95rem; box-shadow: var(--shadow); display: grid; gap: .45rem; }
.asset .nm { font-family: var(--display); font-size: 1.2rem; font-weight: 600; }
.pays { display: flex; gap: .3rem; flex-wrap: wrap; font-size: .88rem; color: var(--muted); align-items: center; }
.pay { border-radius: 8px; padding: .1rem .5rem; font-family: var(--mono); font-size: .88rem; background: var(--w); color: var(--c); font-weight: 500; }

/* tables */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { padding: .4rem .6rem; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: .82rem; }
th:first-child, td:first-child { text-align: left; }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.me td { background: var(--accent-wash); font-weight: 600; }
tr.tot td { border-top: 2px solid var(--line-2); font-weight: 600; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: .4rem; vertical-align: 1px; }

/* results */
.score { display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; }
.score .total { font-family: var(--display); font-size: 3rem; font-weight: 600; color: var(--accent); line-height: 1; }
.pills { display: flex; gap: .5rem; flex-wrap: wrap; }
.pill { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: .35rem .7rem; display: grid; }
.pill b { font-family: var(--mono); font-size: 1.15rem; font-weight: 500; } .pill span { font-size: .78rem; color: var(--muted); }
.lesson { border-left: 4px solid var(--accent); }
.lesson ol { padding-left: 1.2rem; margin-top: .4rem; color: var(--ink-2); } .lesson li + li { margin-top: .45rem; }
.mcq { border: 1px solid var(--line); border-radius: 12px; padding: .75rem .9rem; background: var(--card); }
.mcq + .mcq { margin-top: .7rem; }
.mcq .q { font-weight: 600; margin-bottom: .35rem; }
.mcq label { display: flex; gap: .55rem; align-items: flex-start; padding: .35rem .45rem; border-radius: 8px; cursor: pointer; color: var(--ink-2); }
.mcq label:hover { background: var(--soft); }
.mcq label.right { background: var(--good-wash); color: var(--ink); } .mcq label.wrong { background: var(--bad-wash); }
.mcq input { margin-top: .35rem; accent-color: var(--accent); }
details.more { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: .8rem 1.1rem; }
details.more > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
details.more[open] > summary { margin-bottom: .7rem; }
details.more h3 { margin: 1rem 0 .4rem; font-size: 1.1rem; }

/* seats */
.seat { display: grid; grid-template-columns: 10px 1fr auto; gap: .55rem; align-items: center; padding: .45rem 0; border-bottom: 1px solid var(--line); }
.seat:last-child { border-bottom: 0; }
.seat .nm { font-weight: 600; line-height: 1.2; white-space: nowrap; }
.seat .sub { font-size: .8rem; color: var(--muted); }
.seat select { width: 2.6rem; padding: .15rem .2rem; font-size: .8rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--line-2); }
.dot.on { background: var(--good); } .dot.off { background: var(--bad); }
.layout { display: grid; grid-template-columns: 270px 1fr; gap: 1rem; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

/* misc */
.bigcode { font-family: var(--mono); font-size: clamp(3rem, 9vw, 5rem); letter-spacing: .25em; color: var(--accent); font-weight: 500; }
.hero { padding: 2.2rem 0 1.2rem; }
.hero p { color: var(--ink-2); max-width: 60ch; margin-top: .5rem; font-size: 1.08rem; }
.choices { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); }
.choice { display: grid; gap: .7rem; align-content: start; }
.choice .ic { font-size: 2rem; }
.wheel-wrap { display: grid; place-items: center; padding: .5rem 0; }
.wheel { width: min(300px, 78vw); height: auto; }
.wheel g.rot { transform-origin: 160px 160px; }
.wheel text { font-family: var(--display); font-size: 19px; fill: #fff; font-weight: 600; }
.realized { font-family: var(--display); font-size: 2.2rem; text-align: center; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--body); font-size: 15px; }
.chart .grid line { stroke: var(--line); }
.chart .hit { fill: transparent; } .chart .hit:hover { fill: rgba(31,71,65,.06); }
.legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: .85rem; color: var(--ink-2); margin-top: .4rem; }
.legend span { display: inline-flex; align-items: center; gap: .35rem; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dash { height: 0; border-top: 2px dashed currentColor; background: none !important; }
#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--ink); color: #fff; padding: .45rem .6rem; border-radius: 8px; font-size: .82rem; line-height: 1.4; max-width: 260px; display: none; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 90; display: grid; gap: .4rem; }
#toast div { background: var(--ink); color: #fff; padding: .6rem 1rem; border-radius: 10px; font-size: .95rem; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
#toast div.bad { background: var(--bad); }
.modal-bg { position: fixed; inset: 0; background: rgba(26,32,30,.45); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 3vh 12px; overflow-y: auto; }
.modal { background: var(--bg); border-radius: 16px; max-width: 1000px; width: 100%; padding: 1rem; }
hr { border: 0; border-top: 1px solid var(--line); margin: 1rem 0; }
.hidden { display: none !important; }
@media (max-width: 600px) { .now h2 { font-size: 1.3rem; } th, td { padding: .3rem .4rem; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="tip"></div>
<div id="toast"></div>
<div id="modal"></div>

<script>
'use strict';
/* =====================================================================
   ISLAND MARKETS — general equilibrium under uncertainty, played live
   Engine · scenarios · host logic · networking (MQTT relay) · UI
   ===================================================================== */

/* ---------------------------------------------------------------- engine */
const E = {};
E.u   = (c, g) => g === 1 ? Math.log(c) : Math.pow(c, 1 - g) / (1 - g);
E.up  = (c, g) => Math.pow(c, -g);
E.upp = (c, g) => -g * Math.pow(c, -g - 1);
E.ce  = (U, g) => g === 1 ? Math.exp(U) : Math.pow((1 - g) * U, 1 / (1 - g));
E.EU  = (pi, c, g) => c.some(x => !(x > 0)) ? -Infinity : c.reduce((s, cs, k) => s + pi[k] * E.u(cs, g), 0);
E.CE  = (pi, c, g) => { const U = E.EU(pi, c, g); return isFinite(U) ? E.ce(U, g) : 0; };
E.dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
E.cons = (e, A, th, cash = 0) => e.map((es, s) => es + cash + A.reduce((t, row, j) => t + row[s] * (th[j] || 0), 0));
E.solveLin = (M, b) => {
  const n = b.length, a = M.map((r, i) => [...r, b[i]]);
  for (let i = 0; i < n; i++) {
    let p = i; for (let r = i + 1; r < n; r++) if (Math.abs(a[r][i]) > Math.abs(a[p][i])) p = r;
    [a[i], a[p]] = [a[p], a[i]];
    if (Math.abs(a[i][i]) < 1e-13) return null;
    for (let r = 0; r < n; r++) if (r !== i) { const f = a[r][i] / a[i][i]; for (let k = i; k <= n; k++) a[r][k] -= f * a[i][k]; }
  }
  return a.map((r, i) => r[n] / r[i]);
};
E.rank = (A) => {
  const a = A.map(r => r.slice()); let rk = 0; const rows = a.length, cols = a[0].length;
  for (let c = 0; c < cols && rk < rows; c++) {
    let p = rk; for (let r = rk + 1; r < rows; r++) if (Math.abs(a[r][c]) > Math.abs(a[p][c])) p = r;
    if (Math.abs(a[p][c]) < 1e-9) continue;
    [a[rk], a[p]] = [a[p], a[rk]];
    for (let r = 0; r < rows; r++) if (r !== rk) { const f = a[r][c] / a[rk][c]; for (let k = c; k < cols; k++) a[r][k] -= f * a[rk][k]; }
    rk++;
  }
  return rk;
};
function nullBasis(q) {
  const J = q.length, B = [], qn = Math.hypot(...q), vs = [q.map(x => x / qn)];
  for (let k = 0; k < J && B.length < J - 1; k++) {
    let v = Array.from({ length: J }, (_, i) => +(i === k));
    for (const w of vs) { const d = E.dot(v, w); v = v.map((x, i) => x - d * w[i]); }
    const n = Math.hypot(...v); if (n > 1e-8) { v = v.map(x => x / n); vs.push(v); B.push(v); }
  }
  return B;
}
/* optimal portfolio: max Σ π_s u(e_s + (Aᵀθ)_s)  s.t.  q·θ = 0  (Newton in the null space of q) */
E.optimal = (e, A, q, pi, g = 1) => {
  const J = q.length, S = e.length, N = nullBasis(q), K = N.length;
  if (!K) return new Array(J).fill(0);
  const Bm = Array.from({ length: S }, (_, s) => N.map(v => v.reduce((t, x, j) => t + x * A[j][s], 0)));
  let z = new Array(K).fill(0);
  const cOf = z => e.map((es, s) => es + E.dot(Bm[s], z));
  const f = z => E.EU(pi, cOf(z), g);
  for (let it = 0; it < 120; it++) {
    const c = cOf(z);
    const gr = Array.from({ length: K }, (_, k) => c.reduce((t, cs, s) => t + pi[s] * E.up(cs, g) * Bm[s][k], 0));
    if (Math.hypot(...gr) < 1e-11) break;
    const H = Array.from({ length: K }, (_, k) => Array.from({ length: K }, (_, l) => c.reduce((t, cs, s) => t + pi[s] * E.upp(cs, g) * Bm[s][k] * Bm[s][l], 0)));
    let d = E.solveLin(H, gr.map(x => -x)); if (!d || !d.every(isFinite)) d = gr;
    let t = 1; const f0 = f(z); let moved = false;
    while (t > 1e-12) { const zn = z.map((x, k) => x + t * d[k]); if (f(zn) >= f0 - 1e-15) { z = zn; moved = true; break; } t /= 2; }
    if (!moved) break;
  }
  return Array.from({ length: J }, (_, j) => N.reduce((t, v, k) => t + v[j] * z[k], 0));
};
E.qFromP = (A, p) => A.map(row => E.dot(row, p));
E.normP = p => { const t = p.reduce((a, b) => a + b, 0); return p.map(x => x / t); };
/* auctioneer: state-price parameterised tâtonnement (keeps prices arbitrage-free) */
E.tatStep = (agg, p, Z, A, kappa = 0.8) => {
  const dc = agg.map((_, s) => A.reduce((t, row, j) => t + row[s] * Z[j], 0));
  return E.normP(p.map((ps, s) => ps * Math.pow(Math.min(4, Math.max(0.25, (agg[s] + dc[s]) / agg[s])), kappa)));
};
/* closest arbitrage-free state prices with A p = q (projection, then positivity) */
E.projectP = (A, q, p0) => {
  const AAt = A.map(r => A.map(r2 => E.dot(r, r2)));
  const res = q.map((qj, j) => qj - E.dot(A[j], p0));
  const y = E.solveLin(AAt, res);
  let p = y ? p0.map((ps, s) => ps + A.reduce((t, row, j) => t + row[s] * y[j], 0)) : p0.slice();
  p = p.map((x, s) => Math.max(x, 0.1 * p0[s]));
  return E.normP(p);
};
E.equilibrium = (eco) => {
  let p = eco.pi.slice();
  const pis = eco.endow.map((_, i) => (eco.beliefs && eco.beliefs[i]) || eco.pi);
  const Zof = q => { const Z = new Array(eco.A.length).fill(0); eco.endow.forEach((e, i) => E.optimal(e, eco.A, q, pis[i], eco.gamma).forEach((x, j) => Z[j] += x)); return Z; };
  for (let it = 0; it < 500; it++) {
    const Z = Zof(E.qFromP(eco.A, p));
    if (Math.max(...Z.map(Math.abs)) < 1e-10) break;
    p = E.tatStep(eco.agg, p, Z, eco.A, it < 50 ? 0.8 : 0.4);
  }
  const q = E.qFromP(eco.A, p);
  return { p, q, Z: Zof(q) };
};
E.ration = (orders, J) => {
  const ex = orders.map(o => o ? o.slice() : new Array(J).fill(0));
  for (let j = 0; j < J; j++) {
    let B = 0, S = 0; ex.forEach(o => { if (o[j] > 0) B += o[j]; else S -= o[j]; });
    const V = Math.min(B, S);
    ex.forEach(o => { if (o[j] > 0) o[j] *= B > 0 ? V / B : 0; else if (o[j] < 0) o[j] *= S > 0 ? V / S : 0; });
  }
  return ex;
};
/* Radner (two goods, Cobb–Douglas α): indirect utility in state s with grain-wealth m is ln m + κ_s */
const R = {};
R.kappa = (alpha, rho) => rho.map(r => alpha * Math.log(alpha) + (1 - alpha) * Math.log((1 - alpha) / r));
R.V = (pi, alpha, rho, m) => m.some(x => !(x > 0)) ? 0 : Math.exp(m.reduce((t, x, s) => t + pi[s] * (Math.log(x) + R.kappa(alpha, rho)[s]), 0));
R.m = (sc, i, rho) => sc.grain[i].map((x, s) => x + rho[s] * sc.fish[i][s]);

  reopen() { const rs = this.rs; if (rs.exec) return; rs.stalled = false; rs.cleared = false; this.S.maxIter = Math.max(this.S.maxIter, rs.iter + 5); rs.p = E.tatStep(this.th.agg, rs.p, rs.history[rs.history.length - 1].Z, assetsA(this.sc), this.S.kappa); rs.q = E.qFromP(assetsA(this.sc), rs.p); rs.iter++; rs.orders = {}; this.botOrders(); this.armTimer(); this.changed(); this.maybeAuto(); }
  execute() {
    const rs = this.rs, J = this.sc.assets.length;
    const h = (rs.history.length && rs.history[rs.history.length - 1].iter === rs.iter) ? rs.history[rs.history.length - 1] : this.snapshot();
    const ex = E.ration(h.orders, J);
    rs.exec = ex.map(th => ({ th, cash: -E.dot(h.q, th) }));
    rs.execQ = h.q.slice(); rs.execP = h.p.slice(); rs.execIter = h.iter; rs.deadline = null;
  }
  draw() {
    const pr = this.sc.states.map(s => s.prob); let u = Math.random() * sum(pr), s = 0;
    while (s < pr.length - 1 && u > pr[s]) { u -= pr[s]; s++; }
    this.rs.nature = { s, at: Date.now() }; this.changed();
  }
  /* --- spot market (Radner, two goods) --- */
  openSpot() {
    const sc = this.sc, rs = this.rs, s = rs.nature.s;
    const g = this.seats.map((_, i) => sc.grain[i][s] + rs.exec[i].th[s] + rs.exec[i].cash);
    const y = this.seats.map((_, i) => sc.fish[i][s]);
    const avg = this.S.open === 'forecast' ? this.avgForecast() : null;
    const rho = avg ? avg[fIdx(sc).length + s] : 1;
    rs.spot = { s, g, y, rho, rho0: rho, iter: 1, orders: {}, history: [], cleared: false, stalled: false, exec: null };
  }
  botSpot() {
    const sp = this.rs.spot, a = this.sc.alpha;
    this.seats.forEach(s => { if (s.kind === 'bot') { const M = sp.g[s.i] + sp.rho * sp.y[s.i]; sp.orders[s.i] = [(1 - a) * M / sp.rho - sp.y[s.i]]; } });
  }
  submitSpot(i, dy) {
    const sp = this.rs.spot;
    if (this.phase !== 'spot' || !sp || sp.cleared || sp.stalled || sp.exec) return 'The spot market is not taking orders right now.';
    dy = Number(dy); if (!isFinite(dy)) return 'Enter a number.';
    if (!(sp.g[i] - sp.rho * dy > 0)) return 'You cannot pay for that much fish.';
    if (!(sp.y[i] + dy > 0)) return 'You cannot sell more fish than you have.';
    sp.orders[i] = [dy]; this.changed(); this.maybeAuto(); return null;
  }
  spotSnapshot() {
    const sp = this.rs.spot, orders = this.seats.map(s => sp.orders[s.i] ? sp.orders[s.i].slice() : null);
    const Z = sum(orders.map(o => o ? o[0] : 0)), Y = sum(sp.y), G = sum(sp.g);
    const h = { iter: sp.iter, rho: sp.rho, Z, err: Math.abs(Z) * sp.rho / (G + sp.rho * Y), orders, n: orders.filter(Boolean).length };
    if (sp.history.length && sp.history[sp.history.length - 1].iter === sp.iter) sp.history[sp.history.length - 1] = h; else sp.history.push(h);
    return h;
  }
  computeSpot() {
    const sp = this.rs.spot, h = this.spotSnapshot();
    if (h.err <= this.S.tol) { sp.cleared = true; this.rs.deadline = null; }
    else if (sp.iter >= this.S.maxIter) { sp.stalled = true; this.rs.deadline = null; }
    else { const Y = sum(sp.y); sp.rho *= Math.pow(clamp((Y + h.Z) / Y, 0.25, 4), this.S.kappa); sp.iter++; sp.orders = {}; this.botSpot(); this.armTimer(); }
    this.changed(); this.maybeAuto();
  }
  executeSpot() {
    const sp = this.rs.spot;
    const h = (sp.history.length && sp.history[sp.history.length - 1].iter === sp.iter) ? sp.history[sp.history.length - 1] : this.spotSnapshot();
    const ex = E.ration(h.orders, 1);
    sp.exec = ex.map((o, i) => { let gf = sp.g[i] - h.rho * o[0], yf = sp.y[i] + o[0]; return { dy: o[0], gf: Math.max(gf, 0.01), yf: Math.max(yf, 0.01) }; });
    sp.execRho = h.rho;
  }
  armTimer() { this.rs.deadline = this.S.timer > 0 ? Date.now() + this.S.timer * 1000 : null; }
  tick() {
    const rs = this.rs; if (!rs || !rs.deadline || Date.now() < rs.deadline) return;
    rs.deadline = null;
    if (this.phase === 'trading' && !rs.cleared && !rs.stalled && !rs.exec) this.computeIter();
    else if (this.phase === 'spot' && rs.spot && !rs.spot.cleared && !rs.spot.stalled && !rs.spot.exec) this.computeSpot();
  }
  finish() {
    const sc = this.sc, rs = this.rs, th = this.th, A = assetsA(sc), g = sc.gamma || 1;
    const per = this.seats.map((seat, i) => {
      const f = rs.forecasts[i] || null, ans = rs.answers[i] || [];
      const fScore = forecastScore(f, th.truthF);
      const cScore = sc.concept.reduce((t, c, k) => t + (ans[k] === c.correct ? 25 : 0), 0);
      const ex = rs.exec[i], T = th.per[i]; let c, CE, sScore = null, spot = null;
      if (sc.kind === 'radner') {
        c = th.m[i].map((x, s) => x + ex.th[s] + ex.cash);
        CE = R.V(sc.states.map(s => s.prob), sc.alpha, th.rho, c);
        const sp = rs.spot, se = sp.exec[i], a = sc.alpha, rf = sp.execRho, M = sp.g[i] + rf * sp.y[i];
        const uAct = a * Math.log(se.gf) + (1 - a) * Math.log(se.yf);
        const uOpt = M > 0 ? a * Math.log(a * M) + (1 - a) * Math.log((1 - a) * M / rf) : uAct;
        const ratio = Math.exp(uAct - uOpt);
        sScore = 50 * clamp(1 - 10 * (1 - ratio), 0, 1);
        spot = { g: sp.g[i], y: sp.y[i], dy: se.dy, gf: se.gf, yf: se.yf, ratio };
      } else { c = E.cons(sc.endow[i], A, ex.th, ex.cash); CE = E.CE(piOf(sc, i), c, g); }
      const d = 0.02 * T.CE;
      const wScore = clamp(100 * (CE - T.CE0 + d) / (T.CE - T.CE0 + d), 0, 120);
      const total = Math.round(fScore + wScore + cScore + (sScore || 0));
      return { f, ans, fScore, cScore, wScore, sScore, total, c, CE, th: ex.th, cash: ex.cash, spd: personalStatePrices(piOf(sc, i), c, sc.kind === 'radner' ? 1 : g), spot, bot: seat.kind === 'bot' };
    });
    const gainA = sum(per.map((p, i) => p.CE - th.per[i].CE0)), gainT = sum(th.per.map(p => p.CE - p.CE0));
    rs.results = { per, avgF: this.avgForecast(), gainA, gainT, s: rs.nature.s };
    per.forEach((p, i) => this.scores[i][this.r] = p.total);
    this.history[this.r] = { title: sc.title, gainA, gainT, q: rs.execQ, qT: th.q };
  }
  board() { return this.seats.map((s, i) => ({ i, role: s.role, name: s.name, bot: s.kind === 'bot', total: sum(this.scores[i].filter(x => x != null)), rounds: this.scores[i] })); }

  /* the view one seat is allowed to see */
  viewFor(i) {
    const rs = this.rs, sc = this.sc, ph = this.phase, reveal = ph === 'results' || ph === 'final';
    const v = { me: i, aud: this.S.aud || 'econ', part: this.S.part || 0, bench: this.S.bench || null, phase: ph, r: this.r, nR: this.rounds.length, roundTitles: this.rounds.map(r => r.title), board: this.board(), hist: this.history, tol: this.S.tol, maxIter: this.S.maxIter,
      seats: this.seats.map(s => ({ role: s.role, name: s.name, kind: s.kind, connected: s.connected })) };
    if (!sc || !rs) return v;
    v.sc = reveal ? sc : { ...sc, concept: sc.concept.map(c => ({ q: c.q, options: c.options })), debrief: '', lesson: [] };
    v.hint = this.hintLevel();
    const subMap = ph === 'forecast' ? rs.forecasts : ph === 'trading' ? rs.orders : ph === 'spot' && rs.spot ? rs.spot.orders : {};
    v.rs = {
      iter: rs.iter, q: rs.q, cleared: rs.cleared, stalled: rs.stalled,
      history: rs.history.map(h => ({ iter: h.iter, q: h.q, Z: h.Z, err: h.err, n: h.n })),
      submitted: this.seats.map(s => !!subMap[s.i]),
      myForecast: rs.forecasts[i] || null, myAnswers: rs.answers[i] || null, myOrder: rs.orders[i] || null,
      exec: rs.exec ? rs.exec[i] : null, execQ: rs.execQ, execIter: rs.execIter,
      nature: rs.nature ? { s: rs.nature.s, age: Date.now() - rs.nature.at } : null,
      deadlineIn: rs.deadline ? rs.deadline - Date.now() : null,
    };
    if (rs.spot) { const sp = rs.spot; v.rs.spot = { s: sp.s, rho: sp.rho, iter: sp.iter, cleared: sp.cleared, stalled: sp.stalled, g: sp.g[i], y: sp.y[i], myOrder: sp.orders[i] || null, exec: sp.exec ? sp.exec[i] : null, execRho: sp.execRho, history: sp.history.map(h => ({ iter: h.iter, rho: h.rho, Z: h.Z, err: h.err, n: h.n })) }; }
    if (reveal) { v.rs.results = rs.results; v.th = { q: this.th.q, p: this.th.p, rho: this.th.rho, per: this.th.per, truthF: this.th.truthF, agg: this.th.agg }; v.rs.historyFull = rs.history.map(h => ({ iter: h.iter, q: h.q })); if (rs.spot) v.rs.spotAll = { g: rs.spot.g, y: rs.spot.y, exec: rs.spot.exec, execRho: rs.spot.execRho }; }
    return v;
  }
}

/* ------------------------------------------------------------- networking (MQTT-over-WebSocket relay) */
/* The professor's browser is the server. Messages travel through public MQTT brokers over wss://, which
   works behind most firewalls without accounts or installs. The host listens on every broker at once;
   each student uses the first broker that answers. */
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const TOPIC = code => `islandmkts/v1/${code}`;
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const rid = () => Math.random().toString(36).slice(2, 10);
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch { return null; } }
function myToken() { let t = null; try { t = sessionStorage.getItem('islandmkts-token'); if (!t) { t = rid() + rid() + Date.now().toString(36); sessionStorage.setItem('islandmkts-token', t); } } catch { t = t || rid() + rid(); } return t; }
const parse = buf => { try { return JSON.parse(typeof buf === 'string' ? buf : new TextDecoder().decode(buf)); } catch { return null; } };

function hostNet(game, code, onStatus) {
  if (typeof mqtt === 'undefined') { onStatus('error'); return null; }
  const T = TOPIC(code), links = new Map(); // seat -> { client, token, last }
  const status = () => { const n = clients.filter(c => c.connected).length; onStatus(n ? 'online' : 'reconnecting', `${n}/${clients.length}`); };
  const sendTo = (client, token, obj) => { if (client && client.connected) client.publish(`${T}/down/${token}`, JSON.stringify(obj), { qos: 1 }); };
  const push = i => { const l = links.get(i); if (l) sendTo(l.client, l.token, { t: 'view', v: game.viewFor(i) }); };
  const seatOf = token => { for (const [i, l] of links) if (l.token === token) return i; return null; };
  function onUp(client, buf) {
    const msg = parse(buf); if (!msg || typeof msg !== 'object') return;
    const token = String(msg.token || '').slice(0, 64); if (!token) return;
    if (msg.t === 'hello') {
      const i = game.join(token, String(msg.name || '').trim().slice(0, 40));
      if (i < 0) { sendTo(client, token, { t: 'full' }); return; }
      for (const [k, l] of links) if (l.token === token && k !== i) links.delete(k);
      links.set(i, { client, token, last: Date.now() }); push(i); return;
    }
    const i = seatOf(token);
    if (i == null) { if (msg.t !== 'bye') sendTo(client, token, { t: 'rehello' }); return; }
    const l = links.get(i); l.last = Date.now(); l.client = client;
    if (msg.t === 'bye') { game.seats[i].connected = false; game.changed(); return; }
    if (!game.seats[i].connected && game.seats[i].kind === 'human') { game.seats[i].connected = true; game.changed(); }
    if (msg.t === 'ping') { sendTo(client, token, { t: 'pong' }); return; }
    const err = game.handle(i, msg);
    sendTo(client, token, { t: 'ack', ok: !err, msg: err || 'Received ✓' });
  }
  const clients = BROKERS.map(url => {
    const c = mqtt.connect(url, { clientId: `imk-h-${code}-${rid()}`, reconnectPeriod: 4000, connectTimeout: 8000, clean: true, keepalive: 30 });
    c.on('connect', () => { c.subscribe(`${T}/up`, { qos: 1 }); status(); });
    c.on('message', (_, buf) => onUp(c, buf));
    c.on('close', status); c.on('offline', status); c.on('error', () => {});
    return c;
  });
  let pending = false;
  game.on(() => { if (pending) return; pending = true; setTimeout(() => { pending = false; for (const i of links.keys()) push(i); }, 120); });
  setInterval(() => { const now = Date.now(); let ch = false; for (const [i, l] of links) { const s = game.seats[i]; if (s.kind !== 'human' || s.token !== l.token) { links.delete(i); continue; } if (s.connected && now - l.last > 25000) { s.connected = false; ch = true; } } if (ch) game.changed(); }, 5000);
  return { kick(i) { const l = links.get(i); if (l) { sendTo(l.client, l.token, { t: 'kicked' }); links.delete(i); } } };
}

function clientNet(code, name, onMsg, onStatus) {
  if (typeof mqtt === 'undefined') { onStatus('error'); return null; }
  const T = TOPIC(code), token = myToken();
  let client = null, b = 0, gotView = false, lastHost = 0, hellos = 0, dead = false, everConnected = false;
  const up = obj => { if (client && client.connected) { client.publish(`${T}/up`, JSON.stringify({ ...obj, token }), { qos: 1 }); return true; } return false; };
  const hello = () => { hellos++; up({ t: 'hello', name }); };
  function connect() {
    if (dead) return;
    const url = BROKERS[b % BROKERS.length]; everConnected = false; hellos = 0;
    client = mqtt.connect(url, { clientId: `imk-c-${rid()}`, reconnectPeriod: 0, connectTimeout: 7000, clean: true, keepalive: 30, will: { topic: `${T}/up`, payload: JSON.stringify({ t: 'bye', token }), qos: 0, retain: false } });
    client.on('connect', () => { everConnected = true; onStatus(gotView ? 'connected' : 'connecting'); client.subscribe(`${T}/down/${token}`, { qos: 1 }, () => hello()); });
    client.on('message', (_, buf) => {
      const msg = parse(buf); if (!msg) return; lastHost = Date.now();
      if (msg.t === 'view') { if (!gotView || App.status !== 'connected') onStatus('connected'); gotView = true; }
      if (msg.t === 'rehello') { hello(); return; }
      if (msg.t === 'kicked') { dead = true; onStatus('kicked'); try { client.end(true); } catch {} }
      onMsg(msg);
    });
    client.on('close', () => { if (dead) return; onStatus('reconnecting'); const c = client; setTimeout(() => { if (client === c) { if (!everConnected) b++; connect(); } }, 2000); });
    client.on('error', () => {});
  }
  setInterval(() => {
    if (dead || !client || !client.connected) return;
    if (!gotView) { if (hellos >= 5) { onStatus('noroom'); b++; try { client.end(true); } catch {} return; } hello(); return; }
    up({ t: 'ping' });
    if (Date.now() - lastHost > 30000) { onStatus('reconnecting'); hello(); }
  }, 3500);
  connect();
  window.addEventListener('pagehide', () => up({ t: 'bye' }));
  return { send: m => { if (up(m)) return true; toast('Not connected — retrying…', 'bad'); return false; } };
}

/* ------------------------------------------------------------- UI state */
const App = { mode: null, game: null, net: null, code: null, view: null, send: null, status: '', drafts: {}, showKey: false, modalSeat: null, modalView: null, spun: {}, spinStart: {}, name: '' };
function toast(msg, kind = '') { const d = document.createElement('div'); d.textContent = msg; if (kind) d.className = kind; $('#toast').appendChild(d); setTimeout(() => d.remove(), 3400); }
function draft(id, fallback) { return id in App.drafts ? App.drafts[id] : (fallback == null ? '' : String(fallback)); }
function numIn(id, fallback, extra = '') { return `<input type="text" inputmode="decimal" class="num" id="${id}" data-draft value="${esc(draft(id, fallback))}" ${extra}/>`; }
function readNum(id) { const el = document.getElementById(id); const v = el ? el.value.trim().replace(',', '.') : ''; return v === '' ? NaN : Number(v); }
function readStr(id) { const el = document.getElementById(id); return el ? el.value : ''; }
const pct = x => `${Math.round(100 * x)}%`;
const r2 = x => Math.round(x * 100) / 100;

let renderQueued = false;
function render() { if (renderQueued) return; renderQueued = true; const go = () => { if (!renderQueued) return; renderQueued = false; doRender(); }; requestAnimationFrame(go); setTimeout(go, 60); }
function doRender() {
  const ae = document.activeElement, fid = ae && ae.id, sel = ae && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null;
  const y = window.scrollY;
  let html;
  if (!App.mode) html = landing();
  else if (App.mode === 'setup') html = hostSetup();

  else html = playerScreen();

  $('#modal').innerHTML = App.modalSeat != null && App.game ? seatModal(App.modalSeat) : '';
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
  window.scrollTo(0, y);
  afterRender();
}
function mathIn(el) { if (window.renderMathInElement) try { renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false }); } catch {} }
function afterRender() {
  mathIn(document.body);

  document.querySelectorAll('[data-spotlive]').forEach(el => updateSpotLive(el.dataset.spotlive));
  document.querySelectorAll('[data-fsumbox]').forEach(el => updateFsum(el.dataset.fsumbox));
  document.querySelectorAll('.wheel[data-spin]').forEach(spinWheel);
}

/* ------------------------------------------------------------- building blocks */
function inputMode(sc) { const A = assetsA(sc), S = nS(sc); if (A.length === S && E.rank(A) === S) return 'plan'; return sc.assets.some(a => isSure(a.payoff)) ? 'assets' : 'general'; }
const isArrowSet = sc => sc.assets.length === nS(sc) && sc.assets.every((a, j) => a.payoff.every((x, s) => x === (s === j ? 1 : 0)));
const statePrices = (sc, q) => E.solveLin(assetsA(sc), q);
const stW = st => st.wash || '#f3f4f2';
function tiles(sc, body, only) {
  return `<div class="tiles">${sc.states.map((st, s) => (only != null && s !== only) ? '' : `<div class="tile" style="--c:${st.color};--w:${stW(st)}"><div class="tile-h"><span class="ic">${st.icon || ''}</span><b>${esc(st.name)}</b><span class="pr">${pct(st.prob)} chance</span></div><div class="tile-b">${body(s)}</div></div>`).join('')}</div>`;
}
const kv = (label, value, cls = '') => `<div class="kv ${cls}"><span>${label}</span><b>${value}</b></div>`;
function pays(sc, a) { return `<div class="pays">pays ${a.payoff.map((x, s) => `<span class="pay" style="--c:${sc.states[s].color};--w:${stW(sc.states[s])}" title="${esc(sc.states[s].name)}">${sc.states[s].icon || esc(sc.states[s].name)} ${fx(x, x % 1 ? 2 : 0)}</span>`).join('')}</div>`; }
function arrowOf(now, before) { if (before == null || Math.abs(now / before - 1) < 0.0005) return ''; return now > before ? ' <span class="up">▲</span>' : ' <span class="down">▼</span>'; }
function now(step, title, text, actions = '', wait = false) {
  return `<div class="now ${wait ? 'wait' : ''}"><div><div class="step">${step}</div><h2>${title}</h2>${text ? `<p>${text}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;
}
const STEP_NAMES = [['briefing', 'Read'], ['forecast', 'Predict'], ['trading', 'Trade'], ['nature', 'Weather'], ['spot', 'Spot market'], ['results', 'Results']];
function stepsBar(sc, phase) {
  if (!sc || ['lobby', 'final'].includes(phase)) return '';
  const list = STEP_NAMES.filter(p => p[0] !== 'spot' || sc.kind === 'radner'); const idx = list.findIndex(p => p[0] === phase);
  return `<span class="steps">${list.map((p, k) => `<span class="${k === idx ? 'on' : k < idx ? 'done' : ''}">${k + 1} ${p[1]}</span>`).join('')}</span>`;
}
const partTag = v => v.part ? `Part ${v.part} · ` : '';
function stepLabel(v, ph) { const list = STEP_NAMES.filter(p => p[0] !== 'spot' || v.sc.kind === 'radner'); return `${partTag(v)}Round ${v.r + 1} of ${v.nR} · Step ${list.findIndex(p => p[0] === ph) + 1} of ${list.length}`; }
const isGen = v => !!v && v.aud === 'general';
function howToCard(open = true) { return `<details class="more"${open ? ' open' : ''}><summary>How to play</summary><div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,175px),1fr))">${HOWTO.map(([ic, t, d], k) => `<div class="tile" style="--c:var(--accent);--w:var(--accent-wash)"><div class="tile-h"><span class="ic">${ic}</span><b>${k + 1}. ${t}</b></div><div class="tile-b"><span style="color:var(--ink-2)">${d}</span></div></div>`).join('')}</div></details>`; }
const glossaryCard = () => `<details class="more"><summary>Words you’ll meet</summary><div class="tbl"><table><tbody>${GLOSSARY.map(([w, d]) => `<tr><td style="white-space:normal;vertical-align:top"><b>${w}</b></td><td style="white-space:normal;text-align:left;color:var(--ink-2)">${d}</td></tr>`).join('')}</tbody></table></div></details>`;
const recapCard = v => v.part === 2 ? `<div class="card lesson"><p>${isGen(v) ? GEN_RECAP : PART2_RECAP}</p>${v.bench && v.bench.gainA != null ? `<p class="small muted" style="margin-top:.4rem">Your class achieved ${fx(v.bench.gainA, 1)} of the possible ${fx(v.bench.gainT, 1)} in Part 1.</p>` : ''}</div>` : '';

function economyTable(sc, me, seats) {

/* charts */
function lineChart({ xs, series, height = 250, yFmt = v => fx(v, 2), zeroLine = false }) {
  const W = 560, H = height, L = 58, Rr = 16, T = 12, B = 40;
  const all = series.flatMap(s => s.ys.filter(v => v != null && isFinite(v)));
  if (!all.length) return '';
  let lo = Math.min(...all), hi = Math.max(...all); if (zeroLine) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi - lo < 1e-9) { hi += 0.5; lo -= 0.5; } const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const X = k => L + (xs.length === 1 ? (W - L - Rr) / 2 : k * (W - L - Rr) / (xs.length - 1)), Y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const grid = Array.from({ length: 5 }, (_, k) => lo + (hi - lo) * k / 4);
  const lines = series.map(s => { const pts = s.ys.map((v, k) => v == null ? null : [X(k), Y(v)]).filter(Boolean); return `<polyline fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="6 5"' : ''} stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p.join(',')).join(' ')}"/>${s.dash ? '' : pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join('')}`; }).join('');
  const colW = xs.length > 1 ? (W - L - Rr) / (xs.length - 1) : W - L - Rr;
  const hits = xs.map((x, k) => { const tip = `<b>${esc(x)}</b><br>` + series.map(s => s.ys[k] == null ? '' : `<span style="color:${s.color}">●</span> ${esc(s.name)}: ${yFmt(s.ys[k])}`).filter(Boolean).join('<br>'); return `<rect class="hit" x="${X(k) - colW / 2}" y="${T}" width="${colW}" height="${H - T - B}" data-tip="${esc(tip)}"/>`; }).join('');
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><g class="grid">${grid.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 5}" text-anchor="end">${yFmt(v)}</text>`).join('')}</g>
  ${zeroLine ? `<line x1="${L}" x2="${W - Rr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)"/>` : ''}
  <g>${xs.map((x, k) => `<text x="${X(k)}" y="${H - 12}" text-anchor="middle">${esc(x)}</text>`).join('')}</g>${hits}${lines}</svg>`;
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span style="color:${s.color}"><i class="${s.dash ? 'dash' : ''}" style="background:${s.color}"></i><span style="color:var(--ink-2)">${esc(s.name)}</span></span>`).join('')}</div>` : '';
  return svg + legend;
}
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]'), tip = $('#tip');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';

});

/* nature's wheel */
function wheel(sc, nature, key) {
  const cx = 160, cy = 160, r = 150; let a0 = -90, segs = '';
  sc.states.forEach((s) => {
    const a1 = a0 + 360 * s.prob, la = (a1 - a0) > 180 ? 1 : 0, rad = d => d * Math.PI / 180;
    const p0 = [cx + r * Math.cos(rad(a0)), cy + r * Math.sin(rad(a0))], p1 = [cx + r * Math.cos(rad(a1)), cy + r * Math.sin(rad(a1))];
    const mid = rad((a0 + a1) / 2), tx = cx + r * 0.6 * Math.cos(mid), ty = cy + r * 0.6 * Math.sin(mid);
    segs += `<path d="M${cx},${cy} L${p0[0]},${p0[1]} A${r},${r} 0 ${la} 1 ${p1[0]},${p1[1]} Z" fill="${s.color}" stroke="#fff" stroke-width="3"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle">${esc(s.name)}</text>`;
    a0 = a1;
  });
  let target = 0;
  if (nature) { let c = -90; for (let k = 0; k < nature.s; k++) c += 360 * sc.states[k].prob; const mid = c + 180 * sc.states[nature.s].prob; target = 360 * 5 + (-90 - mid); }
  return `<div class="wheel-wrap"><svg class="wheel" viewBox="0 0 320 330" ${nature ? `data-spin="${key}" data-target="${target}" data-age="${nature.age ?? 0}"` : ''}><g class="rot">${segs}<circle cx="${cx}" cy="${cy}" r="14" fill="#fff" stroke="var(--line-2)"/></g><path d="M160,30 l-13,-26 h26 z" fill="var(--ink)"/></svg></div>`;
}
function spinWheel(svg) {
  const key = svg.dataset.spin, target = +svg.dataset.target, age = +svg.dataset.age, g = svg.querySelector('g.rot');
  if (App.spun[key] || age > 4500) { g.style.transform = `rotate(${target}deg)`; App.spun[key] = true; return; }
  const first = !App.spinStart[key]; if (first) App.spinStart[key] = Date.now();
  const left = Math.max(300, 4000 - (Date.now() - App.spinStart[key]));
  g.style.transform = 'rotate(0deg)';
  requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transition = `transform ${left}ms cubic-bezier(.17,.67,.2,1)`; g.style.transform = `rotate(${target}deg)`; }));
  if (first) setTimeout(() => { App.spun[key] = true; render(); }, 4200);
}
const spunDone = key => !!App.spun[key];

function validateRounds(rs) {
  if (!Array.isArray(rs) || !rs.length) throw new Error('Expected a non-empty array of rounds.');
  rs.forEach((r, k) => {
    const S = r.states?.length; if (!S) throw new Error(`Round ${k + 1}: states missing.`);
    if (Math.abs(sum(r.states.map(s => s.prob)) - 1) > 1e-6) throw new Error(`Round ${k + 1}: probabilities must sum to 1.`);
    if (!r.assets?.length || r.assets.some(a => a.payoff?.length !== S)) throw new Error(`Round ${k + 1}: each asset needs a payoff for every state.`);
    const A = assetsA(r);
    if (E.rank([...A, r.states.map(() => 1)]) !== E.rank(A)) throw new Error(`Round ${k + 1}: a riskless payoff (1,…,1) must be in the span of the assets (it is the numeraire).`);
    if (r.kind === 'radner') { if (r.grain?.length !== 6 || r.fish?.length !== 6) throw new Error(`Round ${k + 1}: need six grain and six fish vectors.`); if (!(r.alpha > 0 && r.alpha < 1)) throw new Error(`Round ${k + 1}: alpha must be in (0,1).`); if (E.rank(A) !== S) throw new Error(`Round ${k + 1}: two-good rounds need complete Arrow securities.`); }
    else if (r.endow?.length !== 6 || r.endow.some(e => e.length !== S || e.some(x => !(x > 0)))) throw new Error(`Round ${k + 1}: need six strictly positive harvest vectors of length ${S}.`);
    r.concept = r.concept || []; r.gamma = r.gamma || 1; r.hint = r.hint ?? 2; r.lesson = r.lesson || []; r.debrief = r.debrief || ''; r.tag = r.tag || ''; r.kind = r.kind || 'assets';
    r.story = r.story || r.intro || ''; r.market = r.market || ''; r.goal = r.goal || '';
    const pal = [['#d99400', '#fdf4de'], ['#2a78d6', '#e7f0fb'], ['#5b4bb8', '#eeebf8'], ['#1b8a5a', '#e3f3ea'], ['#c2410c', '#fdebe1']];
    r.states.forEach((s, j) => { s.color = s.color || pal[j % 5][0]; s.wash = s.wash || pal[j % 5][1]; s.icon = s.icon || ''; });
    r.assets.forEach((a, j) => { a.sym = a.sym || `a_{${j + 1}}`; a.unit = a.unit || 'grain'; });
  });
  return rs;
}

  const waiting = G.waitingSeats().filter(s => !rs.orders[s.i]).map(s => s.name || s.role);
  const btn = rs.cleared ? '<button class="primary big" data-act="advance">Execute trades ▸</button>' : rs.stalled ? '<button class="primary big" data-act="advance">Execute as is ▸</button><button class="ghost" data-act="reopen">Allow 5 more rounds</button>' : '';
  const text = rs.cleared ? 'Supply equals demand. Execute the trades.' : rs.stalled ? 'The bidding limit was reached. Execute (orders are scaled down proportionally) or allow more rounds.' : `Bidding round ${rs.iter}: ${n} of 6 plans in.${waiting.length ? ` Waiting for ${waiting.map(esc).join(', ')}.` : ''}${rs.deadline ? ` ⏱ <span class="mono" data-countdown="${rs.deadline}">${Math.max(0, Math.round((rs.deadline - Date.now()) / 1000))}</span>s` : ''}`;
  let h = now(`Round ${G.r + 1} · Step 3 · Market`, rs.cleared ? '✅ The market has cleared' : 'The market is open', text, btn) + key;
  if (inputMode(sc) === 'plan' && isArrowSet(sc)) {
    h += tiles(sc, s => kv('Price of 1 grain', fx(rs.q[s], 3) + arrowOf(rs.q[s], pq && pq[s]), 'big') + (last ? kv('Last round excess demand', `<span class="${last.Z[s] > 0.05 ? 'up' : last.Z[s] < -0.05 ? 'down' : ''}">${sgn(last.Z[s], 1)}</span>`) : ''));
  } else {
    h += `<div class="assets">${sc.assets.map((a, j) => `<div class="asset"><div class="nm">${esc(a.name)}</div>${pays(sc, a)}${kv('Price', `${fx(rs.q[j], 3)}${arrowOf(rs.q[j], pq && pq[j])}`, 'big')}${last ? kv('Last round excess demand', sgn(last.Z[j], 1)) : ''}</div>`).join('')}</div>`;
  }
  h += `<details class="more"><summary>Auctioneer controls</summary><div class="row" style="margin-bottom:.8rem">${!rs.cleared && !rs.stalled ? '<button data-act="compute">Next bidding round now (don’t wait)</button>' : ''}${!rs.cleared ? '<button data-act="advance">Execute now</button>' : ''}</div>
    <p class="small muted">Post your own prices (they are made arbitrage-free so that a sure grain costs 1):</p><div class="row">${sc.assets.map((a, j) => `<label class="fld" style="width:9rem">${esc(a.name)}${numIn(`h-px${j}`, +rs.q[j].toFixed(4))}</label>`).join('')}<button class="sm" data-act="set-prices">Post prices</button></div></details>`;
  h += `<details class="more"><summary>Bidding history</summary>${historyTable(sc, rs.history, G.S.tol, G.S.aud === 'general')}${rs.history.length > 1 ? lineChart({ xs: rs.history.map(x => `round ${x.iter}`), series: sc.assets.map((a, j) => ({ name: a.name, color: SERIES[j], ys: rs.history.map(x => x.Z[j]) })), yFmt: x => fx(x, 1), zeroLine: true }) : ''}</details>`;
  return h;
}
function hostSpot(key) {
  const G = App.game, sc = G.sc, sp = G.rs.spot, st = sc.states[sp.s];
  const n = Object.keys(sp.orders).length;
  const btn = sp.cleared || sp.stalled ? '<button class="primary big" data-act="advance">Execute & show results ▸</button>' : '';
  return now(`Round ${G.r + 1} · Spot market · ${st.icon} ${esc(st.name)}`, sp.cleared ? '✅ The fish market has cleared' : `Fish market: ${n} of 6 orders in`, `Price of 1 fish: ${fx(sp.rho, 3)} grain (opened at the class prediction ${fx(sp.rho0, 3)}).`, btn) + key
    + `<details class="more"><summary>Auctioneer controls</summary><div class="row">${!sp.cleared && !sp.stalled ? '<button data-act="compute-spot">Next bidding round now</button>' : ''}<button data-act="advance">Execute now</button></div></details>
    <details class="more"><summary>Bidding history</summary><div class="tbl"><table><thead><tr><th>Round</th><th>Fish price</th><th>Excess demand</th><th>Orders</th></tr></thead><tbody>${sp.history.map(x => `<tr><td>${x.iter}</td><td class="n">${fx(x.rho, 3)}</td><td class="n">${sgn(x.Z, 1)}</td><td class="n">${x.n}/6</td></tr>`).join('')}</tbody></table></div></details>`;
}
function seatModal(i) {
  const G = App.game; const v = G.viewFor(i); App.modalView = v;
  const can = ['forecast', 'trading', 'spot'].includes(v.phase);
  return `<div class="modal-bg" data-act="close-modal-bg"><div class="modal stack"><div class="row" style="justify-content:space-between"><h2>Entering for ${ROLES[i].icon} ${esc(ROLES[i].name)}</h2><button data-act="close-modal">Close</button></div>
  ${can ? playerMain(v, `m${i}-`) : '<p class="muted">Nothing to enter at this step.</p>'}</div></div>`;
}

/* ------------------------------------------------------------- events */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-draft]')) App.drafts[t.id] = t.value;
  if (t.dataset.livein != null) updateLive(t.dataset.livein);
  if (t.dataset.spotin != null) updateSpotLive(t.dataset.spotin);
  if (t.dataset.fsum != null) updateFsum(t.dataset.fsum);
  if (t.id === 's-json') App.drafts['s-json'] = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.radio) App.drafts[t.dataset.radio] = t.value;
  if (t.dataset.setupRound != null) App.setup.use[+t.dataset.setupRound] = t.checked;
  if (t.dataset.setupHint != null) App.setup.hints[+t.dataset.setupHint] = +t.value;
  if (t.dataset.seatKind != null && t.value) {
    const i = +t.dataset.seatKind, k = t.value; t.value = '';
    if (k === 'act') { App.modalSeat = i; render(); return; }
    if (App.net) App.net.kick(i); App.game.setSeatKind(i, k); if (k === 'manual') App.modalSeat = i; render();
  }
});
function setVal(id, val) { App.drafts[id] = String(val); const el = document.getElementById(id); if (el) el.value = String(val); }
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, pre = b.dataset.pre || '';
  if (act === 'close-modal-bg' && e.target !== b) return;
  const G = App.game;
  const send = (msg) => {
    if (pre && pre.startsWith('m')) { const i = +pre.slice(1, pre.indexOf('-')); const err = G.handle(i, msg); toast(err || 'Entered ✓', err ? 'bad' : ''); return; }
    if (App.mode === 'solo') { const err = G.handle(App.soloSeat, msg); if (err) toast(err, 'bad'); else toast('Submitted ✓'); return; }
    App.send && App.send(msg);
  };
  const vv = pre ? App.modalView : App.view;
  switch (act) {
    case 'home': if (App.mode === 'solo') store('islandmkts-solo', null); location.href = location.pathname; break;
    case 'join': {
      const code = (readStr('j-code') || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), name = (readStr('j-name') || '').trim();
      if (code.length !== 5) return toast('Enter the 5-letter room code.', 'bad'); if (!name) return toast('Enter your first name.', 'bad');
      store('islandmkts-name', name); startClient(code, name); break;
    }
    case 'setup': App.setup = { aud: 'general', part: null, rounds: [], use: [], hints: {}, S: { ...DEFAULT_SETTINGS } }; App.mode = 'setup'; render(); break;
    case 'set-aud': App.setup.aud = b.dataset.aud; render(); break;
    case 'pick-part': { const k = b.dataset.part === '' ? null : +b.dataset.part; const rs = k == null ? [] : roundsOfPart(k); Object.assign(App.setup, { part: k, rounds: rs, use: rs.map(() => true), hints: {}, custom: false }); delete App.drafts['s-json']; window.scrollTo(0, 0); render(); break; }
    case 'json-apply': try { const rs = validateRounds(JSON.parse(App.drafts['s-json'] ?? $('#s-json').value)); App.setup.rounds = rs; App.setup.use = rs.map(() => true); App.setup.hints = {}; App.setup.custom = true; delete App.drafts['s-json']; toast(`Loaded ${rs.length} rounds ✓`); render(); } catch (err) { toast('JSON error: ' + err.message, 'bad'); } break;
    case 'json-reset': App.setup.rounds = roundsOfPart(App.setup.part || 0); App.setup.use = App.setup.rounds.map(() => true); App.setup.custom = false; App.setup.hints = {}; delete App.drafts['s-json']; render(); break;
    case 'open-room': {
      readSetup(); const st = App.setup; const rounds = st.rounds.filter((_, k) => st.use[k]); if (!rounds.length) return toast('Select at least one round.', 'bad');
      const hints = {}; st.rounds.forEach((r, k) => { if (st.use[k] && st.hints[k] != null) hints[rounds.indexOf(r)] = st.hints[k]; });
      const extra = st.part ? { part: st.part } : {};
      if (st.part === 2 && !st.custom) { const p1 = store('islandmkts-part1'); extra.bench = { gainT: stormYearGain(), gainA: p1 && isFinite(p1.gainA) ? p1.gainA : null }; }
      extra.aud = st.aud;
      startHost(new Game(st.custom ? rounds : forAudience(rounds, st.aud), { ...st.S, hints, ...extra }), newCode()); break;
    }
    case 'resume': { const s = store('islandmkts-host'); if (s) startHost(Game.restore(s.game), s.code); break; }
    case 'solo': startSolo(+$('#solo-role').value, +$('#solo-part').value, $('#solo-aud').value); break;
    case 'advance': G.advance(); break;
    case 'compute': G.computeIter(); break;
    case 'compute-spot': G.computeSpot(); break;
    case 'reopen': G.reopen(); break;
    case 'set-prices': { const q = G.sc.assets.map((_, j) => readNum(`h-px${j}`)); if (!q.every(x => x > 0)) return toast('Prices must be positive.', 'bad'); G.sc.assets.forEach((_, j) => delete App.drafts[`h-px${j}`]); G.setPrices(q); break; }
    case 'toggle-key': App.showKey = b.checked; render(); break;
    case 'copy-link': try { await navigator.clipboard.writeText(b.dataset.url); toast('Link copied ✓'); } catch { toast('Copy failed: select the link manually.', 'bad'); } break;
    case 'end-host': if (confirm('End this session? Students will be disconnected. (The game stays saved in this browser so you can resume.)')) location.href = location.pathname; break;
    case 'close-modal': case 'close-modal-bg': App.modalSeat = null; render(); break;
    case 'bump': {
      const id = b.dataset.id, cur = readNum(id), step = +b.dataset.d;
      setVal(id, r2((isFinite(cur) ? cur : 0) + step));
      if (b.dataset.spot) updateSpotLive(pre); else updateLive(pre);
      break;
    }
    case 'fit': {
      const P = computePlan(vv, pre); if (!(P.planCost > 0)) return;
      const f = P.w / P.planCost; vv.sc.states.forEach((_, s) => setVal(`${pre}r${vv.r}-c${s}`, r2(P.c[s] * f)));
      updateLive(pre); break;
    }
    case 'reset-plan': { const P = computePlan(vv, pre); vv.sc.states.forEach((_, s) => setVal(`${pre}r${vv.r}-c${s}`, r2(P.base[s]))); updateLive(pre); break; }
    case 'zero-order': vv.sc.assets.forEach((_, j) => setVal(`${pre}r${vv.r}-o${j}`, 0)); updateLive(pre); break;
    case 'send-forecast': {
      const sc = vv.sc, n = forecastLabels(sc).length, f = Array.from({ length: n }, (_, k) => readNum(`${pre}r${vv.r}-f${k}`));
      if (!f.every(x => x > 0)) return toast('Enter a positive number for every price.', 'bad');
      const ans = sc.concept.map((_, k) => { const el = document.querySelector(`input[name="${pre}r${vv.r}-c${k}"]:checked`); return el ? +el.value : null; });
      if (ans.some(a => a == null) && !confirm('You have not answered every question. Submit anyway?')) return;
      send({ t: 'forecast', f, ans }); break;
    }
    case 'send-order': {
      let P = computePlan(vv, pre);
      if (P.mode === 'plan' && P.cost > 0.01 && P.cost <= 0.01 * P.w && P.planCost > 0) {
        const f = P.w / P.planCost; vv.sc.states.forEach((_, s) => setVal(`${pre}r${vv.r}-c${s}`, Math.floor(P.c[s] * f * 1000) / 1000)); updateLive(pre); P = computePlan(vv, pre);
        toast('Your plan was a little over budget, so it was scaled down slightly to fit.');
      }
      if (P.mode === 'plan' && P.cost > 0.01) return toast('Your plan costs more than your harvest is worth. Press “Fit to budget”.', 'bad');
      if (!P.c.every(x => x > 0)) return toast('Every amount must stay positive.', 'bad');
      const err = validateOrder(vv.sc, vv.me, vv.rs.q, P.th, rhoHatOf(vv, pre)); if (err) return toast(err, 'bad');
      send({ t: 'order', th: P.th }); break;
    }
    case 'send-spot': { const dy = readNum(`${pre}r${vv.r}-dy`); if (!isFinite(dy)) return toast('Enter a number.', 'bad'); send({ t: 'spot', dy }); break; }
  }
});
setInterval(() => {
  document.querySelectorAll('[data-countdown]').forEach(el => { el.textContent = Math.max(0, Math.round((+el.dataset.countdown - Date.now()) / 1000)); });
  if (App.game && (App.mode === 'host' || App.mode === 'solo')) App.game.tick();
}, 500);
window.addEventListener('load', render);

/* ------------------------------------------------------------- start-up */
function startHost(game, code) {
  App.mode = 'host'; App.game = game; App.code = code; App.status = '';
  let saveT = null;
  game.on(() => {
    render(); clearTimeout(saveT); saveT = setTimeout(() => store('islandmkts-host', { code, game: game.serialize() }), 300);
    const k = game.rounds.findIndex(r => r.id === 'r2'); const h = k >= 0 && game.history[k];
    if (h) store('islandmkts-part1', { gainA: h.gainA, gainT: h.gainT, at: Date.now() });
  });
  App.net = hostNet(game, code, (s, detail) => { if (App.status === s && App.statusDetail === detail) return; App.status = s; App.statusDetail = detail; render(); });
  history.replaceState(null, '', location.pathname);
  store('islandmkts-host', { code, game: game.serialize() });
  render();
}
function startClient(code, name) {
  App.mode = 'player'; App.code = code; App.name = name; App.status = 'connecting'; App.view = null;
  history.replaceState(null, '', `${location.pathname}?join=${code}`);
  const net = clientNet(code, name, msg => {
    if (msg.t === 'view') { const prev = App.view; App.view = msg.v; if (!prev || prev.r !== msg.v.r) App.drafts = Object.fromEntries(Object.entries(App.drafts).filter(([k]) => !/^r\d+-/.test(k) || k.startsWith(`r${msg.v.r}-`))); render(); }
    else if (msg.t === 'ack') toast(msg.msg, msg.ok ? '' : 'bad');
    else if (msg.t === 'full') { toast('The room is full.', 'bad'); App.status = 'error'; render(); }
  }, s => { App.status = s; render(); });
  App.send = net ? net.send : null;
  render();
}
function startSolo(role, part = 0, aud = 'general') {
  const g = new Game(forAudience(roundsOfPart(part), aud), { aud, timer: 0, autoClear: true, open: 'forecast', ...(part ? { part } : {}), ...(part === 2 ? { bench: { gainT: stormYearGain(), gainA: null } } : {}) });
  const s = g.seats[role]; s.kind = 'local'; s.name = 'You'; s.connected = true;
  App.mode = 'solo'; App.game = g; App.soloSeat = role; App.status = 'local';
  g.on(() => { App.view = g.viewFor(role); render(); });
  g.start();
}
render();
</script>
